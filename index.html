<style>
:root{--pine:#0E2A23;--paper:#F6F7F4;--ink:#1A1F1C;--line:#CBD2CC;--err:#B3372E}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'IBM Plex Sans',-apple-system,sans-serif;background:var(--pine);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:var(--paper);border-radius:10px;padding:34px 36px;width:min(380px,100%);box-shadow:0 20px 60px rgba(0,0,0,.35)}
h1{font-size:17px;font-weight:600;color:var(--ink)}
.sub{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#7C857F;margin:4px 0 22px}
label{display:block;font-size:12px;font-weight:600;color:#4A544E;margin:14px 0 5px}
input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:6px;font:inherit;font-size:14px;background:#fff}
input:focus{outline:2px solid var(--pine);border-color:transparent}
button{width:100%;margin-top:20px;padding:11px;background:var(--pine);color:#fff;border:none;border-radius:6px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
button:hover{filter:brightness(1.15)}
button:disabled{opacity:.6;cursor:wait}
.err{color:var(--err);font-size:12.5px;margin-top:12px;min-height:17px}
.foot{font-size:11px;color:#7C857F;margin-top:18px;line-height:1.5}
</style></head><body>

<script>
const BLOB=JSON.parse(document.getElementById('blob').textContent);
const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const enc=new TextEncoder();
async function unwrap(user,pass){
  const rec=BLOB.users.find(x=>x.u===user.trim().toLowerCase());
  if(!rec) return null;
  const base=await crypto.subtle.importKey('raw',enc.encode(rec.u+':'+pass),'PBKDF2',false,['deriveKey']);
  const kek=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(rec.s),iterations:BLOB.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  try{ return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(rec.i)},kek,u8(rec.k))); }
  catch(e){ return null; }
}
async function openApp(rawKey){
  const key=await crypto.subtle.importKey('raw',rawKey,'AES-GCM',false,['decrypt']);
  const pt=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(BLOB.iv)},key,u8(BLOB.ct)));
  try{ sessionStorage.setItem('liveContentKey',btoa(String.fromCharCode.apply(null,rawKey))); }catch(e){}
  let html;
  if(BLOB.z==='gzip'){
    const stream=new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'));
    html=await new Response(stream).text();
  }else{
    html=new TextDecoder().decode(pt);
  }
  document.open(); document.write(html); document.close();
}
async function attempt(){
  const btn=document.getElementById('go'), err=document.getElementById('err');
  err.textContent='';
  if(!(window.crypto&&crypto.subtle)){ err.textContent='This environment blocks WebCrypto — open the page in a normal browser tab (https or a downloaded file).'; return; }
  const u=document.getElementById('u').value, pw=document.getElementById('p').value;
  if(!u||!pw){ err.textContent='Enter both username and password.'; return; }
  btn.disabled=true; btn.textContent='Decrypting…';
  try{
    const raw=await unwrap(u,pw);
    if(raw){ await openApp(raw); return; }
    err.textContent='Wrong username or password.'; document.getElementById('p').select();
  }catch(e){ err.textContent='Could not decrypt here: '+e.message+'. Try a normal browser tab.'; }
  btn.disabled=false; btn.textContent='Open the dashboard';
}
document.getElementById('go').addEventListener('click',attempt);
['u','p'].forEach(id=>document.getElementById(id).addEventListener('keydown',e=>{ if(e.key==='Enter') attempt(); }));
async function autoUnlock(){ try{
  const b64=sessionStorage.getItem('liveContentKey');
  if(b64) await openApp(u8(b64));
}catch(e){ try{sessionStorage.removeItem('liveContentKey');}catch(_){}} }
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',autoUnlock);
else autoUnlock();
</script></body></html>
